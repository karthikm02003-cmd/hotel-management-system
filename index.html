<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Hotel Management Dashboard</h1>
    </header>

    <main>
        <!-- Section for adding new rooms -->
        <section class="add-room-section card">
            <h2>Add New Room</h2>
            <form id="addRoomForm">
                <div class="form-group">
                    <label for="roomNumber">Room Number:</label>
                    <input type="text" id="roomNumber" required placeholder="e.g., 101, 205A">
                </div>
                <div class="form-group">
                    <label for="roomType">Room Type:</label>
                    <select id="roomType" required>
                        <option value="Standard">Standard</option>
                        <option value="Deluxe">Deluxe</option>
                        <option value="Suite">Suite</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="roomPrice">Price per Night ($):</label>
                    <input type="number" id="roomPrice" min="0" step="0.01" required placeholder="e.g., 100.00">
                </div>
                <button type="submit" class="btn btn-primary">Add Room</button>
            </form>
        </section>

        <!-- Section for displaying room list and filters -->
        <section class="room-list-section">
            <div class="controls card">
                <h2>Room List</h2>
                <div class="filters">
                    <label for="filterStatus">Filter by Status:</label>
                    <select id="filterStatus">
                        <option value="All">All</option>
                        <option value="Available">Available</option>
                        <option value="Occupied">Occupied</option>
                        <option value="Needs Cleaning">Needs Cleaning</option>
                    </select>
                </div>
            </div>
            <div id="roomList" class="room-grid">
                <!-- Room cards will be rendered here by JavaScript -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
